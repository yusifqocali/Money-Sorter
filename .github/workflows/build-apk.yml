name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ManatBolgusu.apk

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManatBolgusu-apk
          path: ManatBolgusu.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Manat Bölgüsü v1.${{ github.run_number }}
          body: |
            Telefonda yükləmək üçün aşağıdakı **ManatBolgusu.apk** faylına toxunun.
            Download **ManatBolgusu.apk** below on your Android phone and open it to install.
          files: ManatBolgusu.apk
          make_latest: true
